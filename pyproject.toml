[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replaygraph"
version = "0.1.0"
description = "Deterministic replay and evaluation harness for LangGraph agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
replaygraph = "replaygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
